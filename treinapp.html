<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="theme-color" content="#0e1116">
<title>Log de Treino</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Log de Treino</h1>
      <div class="sub">Seg·Qua·Sex HYROX · Ter·Sáb resistido</div>
    </div>
    <input type="date" id="date">
  </div>

  <div class="rowhead">
    <span class="label">Treino do dia</span>
    <span class="badge" id="badge"></span>
  </div>
  <div class="pills" id="pills"></div>

  <div id="content"></div>

  <div class="backup">
    <div class="rowhead"><span class="label">Backup manual</span></div>
    <div class="backup-btns">
      <button class="btn" onclick="exportData()">Exportar (copiar JSON)</button>
      <button class="btn" onclick="toggleImport()">Importar</button>
    </div>
    <textarea id="exportBox" class="jsonbox" rows="4" readonly style="display:none"></textarea>
    <div id="exportMsg" class="backupmsg"></div>

    <div id="importBox" style="display:none">
      <textarea id="importInput" class="jsonbox" rows="4" placeholder="Cole aqui o JSON exportado"></textarea>
      <button class="btn btn-primary" onclick="importData()">Confirmar importação</button>
      <div id="importMsg" class="backupmsg"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
