<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="theme-color" content="#0e1116">
<title>Log de Treino</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0e1116; color: #e7ecf3;
    font-family: -apple-system, system-ui, sans-serif;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 80px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
  .sub { font-size: 12px; color: #7d8aa0; margin-top: 2px; }
  input[type=date] {
    background: #1a212b; border: 1px solid #2b3542; color: #e7ecf3;
    padding: 8px 10px; border-radius: 8px; font-size: 15px; font-family: inherit;
  }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #7d8aa0; font-weight: 700; }
  .rowhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .badge { font-size: 12px; font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .pill {
    padding: 10px 12px; border-radius: 10px; border: 1px solid #2b3542;
    background: #141a22; color: #aeb8c6; font-weight: 600; font-size: 13px;
    cursor: pointer; text-align: left; flex: 1 1 45%; font-family: inherit;
  }
  .pill.active { border-color: #4ea1ff; background: #12233b; color: #9ecbff; }
  .pill small { display: block; font-size: 11px; font-weight: 400; opacity: 0.7; margin-top: 2px; }
  .empty { text-align: center; color: #5f6b7d; font-size: 14px; padding: 40px 20px; border: 1px dashed #2b3542; border-radius: 12px; }
  .hyrox { background: #12233b; border: 1px solid #2b4a72; border-radius: 12px; padding: 20px; text-align: center; }
  .hyrox .chk { font-size: 34px; margin-bottom: 6px; }
  .whead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .wtitle { font-size: 17px; font-weight: 700; }
  .cols { display: flex; font-size: 11px; color: #7d8aa0; font-weight: 700; padding: 0 4px 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .ex { background: #141a22; border: 1px solid #232c38; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .exrow { display: flex; align-items: center; gap: 8px; }
  .extag { font-size: 10px; font-weight: 800; color: #4ea1ff; background: #0e1b2e; padding: 1px 5px; border-radius: 4px; }
  .exname { font-size: 14px; font-weight: 600; }
  .exscheme { font-size: 12px; color: #7d8aa0; margin-top: 3px; }
  .num {
    background: #0e1116; border: 1px solid #2b3542; color: #e7ecf3;
    padding: 8px 6px; border-radius: 8px; font-size: 15px; text-align: center; font-family: inherit;
  }
  .num.carga { width: 70px; } .num.reps { width: 56px; }
  .last { font-size: 11px; color: #5f6b7d; margin-top: 6px; }
  .last b { color: #8aa0bc; font-weight: 600; }
  .note { font-size: 11px; color: #5f6b7d; margin-top: 6px; font-style: italic; }
  input:focus { outline: none; border-color: #4ea1ff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Log de Treino</h1>
      <div class="sub">Seg·Qua·Sex HYROX · Ter·Sáb resistido</div>
    </div>
    <input type="date" id="date">
  </div>

  <div class="rowhead">
    <span class="label">Treino do dia</span>
    <span class="badge" id="badge"></span>
  </div>
  <div class="pills" id="pills"></div>

  <div id="content"></div>
</div>

<script>
const HYROX = { id:"hyrox", label:"HYROX", type:"hyrox", focus:"Metabólico / inferiores" };
const WORKOUTS = [
  { id:"peito", label:"Peito / Tríceps", type:"resist", focus:"Empurrar", exercises:[
    {id:"p_a1", name:"Supino inclinado halteres (45°)", scheme:"4 × 8-10", tag:"A1"},
    {id:"p_a2", name:"Crossover polia alta", scheme:"4 × 12-15", tag:"A2"},
    {id:"p_b1", name:"Supino reto barra", scheme:"3 × 6-8", tag:"B1"},
    {id:"p_b2", name:"Crucifixo no crossover", scheme:"3 × 12", tag:"B2"},
    {id:"p_c1", name:"Tríceps corda (polia)", scheme:"3 × 12", tag:"C1"},
    {id:"p_c2", name:"Tríceps testa barra W", scheme:"3 × 10", tag:"C2"},
    {id:"p_d", name:"Mergulho no banco (finisher)", scheme:"2 × falha", tag:"D"},
    {id:"p_e", name:"Rosca punho invertida W (antebraço)", scheme:"2 × 15-20", tag:"E"},
  ]},
  { id:"costas", label:"Costas / Bíceps", type:"resist", focus:"Puxar", exercises:[
    {id:"c_a1", name:"Barra fixa (ou puxada alta)", scheme:"4 × 6-10", tag:"A1"},
    {id:"c_a2", name:"Remada polia baixa", scheme:"4 × 10-12", tag:"A2"},
    {id:"c_b1", name:"Remada curvada barra*", scheme:"3 × 8-10", tag:"B1"},
    {id:"c_b2", name:"Pullover no crossover", scheme:"3 × 12", tag:"B2"},
    {id:"c_c1", name:"Rosca direta barra W", scheme:"3 × 10", tag:"C1"},
    {id:"c_c2", name:"Rosca martelo halteres", scheme:"3 × 12", tag:"C2"},
    {id:"c_d", name:"Rosca no cabo (finisher)", scheme:"2 × 15", tag:"D"},
    {id:"c_e1", name:"Rosca de punho (flexão)", scheme:"3 × 15-20", tag:"E1"},
    {id:"c_e2", name:"Rosca de punho invertida", scheme:"3 × 15-20", tag:"E2"},
    {id:"c_f", name:"Farmer's hold halteres", scheme:"2 × máx tempo", tag:"F"},
  ]},
  { id:"inferior", label:"Inferior pesado", type:"resist", focus:"Encaixe a cada 2-3 semanas", exercises:[
    {id:"i_a1", name:"Leg press 45", scheme:"4 × 8-10", tag:"A1"},
    {id:"i_a2", name:"Cadeira extensora", scheme:"3 × 12", tag:"A2"},
    {id:"i_b", name:"Flexora em pé (unilateral)", scheme:"4 × 10-12", tag:"B"},
    {id:"i_c", name:"RDL com barra (lower back)", scheme:"3 × 8", tag:"C"},
    {id:"i_d", name:"Panturrilha em pé", scheme:"4 × 15", tag:"D"},
  ]},
  HYROX,
];
const byId = id => WORKOUTS.find(w => w.id === id);
const KEY = "logTreino_v1";

let data = { selected:{}, loads:{}, reps:{} };
try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); data = { selected:p.selected||{}, loads:p.loads||{}, reps:p.reps||{} }; } } catch(e){}

let saveTimer = null;
function save() {
  setBadge("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); setBadge("saved"); setTimeout(()=>setBadge("idle"), 1500); }
    catch(e){ setBadge("err"); }
  }, 400);
}
function setBadge(s) {
  const el = document.getElementById("badge");
  const map = { idle:["",""], saving:["salvando…","#7d8aa0"], saved:["✓ salvo","#5fd08a"], err:["erro ao salvar","#ff6b6b"] };
  const [t,c] = map[s]; el.textContent = t; el.style.color = c;
}

const dateEl = document.getElementById("date");
dateEl.value = new Date().toISOString().slice(0,10);
dateEl.addEventListener("change", render);

function lastLoadFor(exId, day) {
  const entries = Object.keys(data.loads)
    .filter(k => k.endsWith("|"+exId) && data.loads[k])
    .map(k => ({ date:k.split("|")[0], val:data.loads[k] }))
    .filter(e => e.date < day)
    .sort((a,b)=> a.date<b.date?1:-1);
  return entries.length ? entries[0] : null;
}

function pickWorkout(id) {
  const day = dateEl.value;
  data.selected[day] = data.selected[day] === id ? undefined : id;
  save(); render();
}

function renderPills() {
  const day = dateEl.value;
  const cur = data.selected[day] || "";
  document.getElementById("pills").innerHTML = WORKOUTS.map(w =>
    `<button class="pill ${cur===w.id?'active':''}" onclick="pickWorkout('${w.id}')">${w.label}<small>${w.focus}</small></button>`
  ).join("");
}

function render() {
  renderPills();
  const day = dateEl.value;
  const cur = data.selected[day] || "";
  const w = cur ? byId(cur) : null;
  const c = document.getElementById("content");

  if (!w) { c.innerHTML = `<div class="empty">Escolha o treino que você fez nesta data para começar a registrar.</div>`; return; }
  if (w.type === "hyrox") {
    c.innerHTML = `<div class="hyrox"><div class="chk">✓</div><div style="font-weight:700;font-size:16px">HYROX registrado nesta data</div><div style="font-size:13px;color:#9ab0cc;margin-top:4px">Treino metabólico — sem registro de carga.</div></div>`;
    return;
  }

  let html = `<div class="whead"><div class="wtitle">${w.label}</div><div style="font-size:12px;color:#7d8aa0">carga (kg) · reps</div></div>`;
  html += `<div class="cols"><div style="flex:1">Exercício</div><div style="width:70px;text-align:center">Carga</div><div style="width:56px;text-align:center">Reps</div></div>`;
  w.exercises.forEach(ex => {
    const last = lastLoadFor(ex.id, day);
    const lk = day+"|"+ex.id;
    html += `<div class="ex">
      <div class="exrow">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="extag">${ex.tag}</span><span class="exname">${ex.name}</span>
          </div>
          <div class="exscheme">${ex.scheme}</div>
        </div>
        <input class="num carga" inputmode="decimal" placeholder="${last?last.val:'—'}" value="${data.loads[lk]||''}" oninput="setLoad('${ex.id}', this.value)">
        <input class="num reps" inputmode="numeric" placeholder="—" value="${data.reps[lk]||''}" oninput="setRep('${ex.id}', this.value)">
      </div>
      ${last ? `<div class="last">última: <b>${last.val}kg</b> · ${last.date.slice(5)}</div>` : ``}
    </div>`;
  });
  if (w.id === "costas") html += `<div class="note">* Se lombar/pegada fadigadas pós-HYROX, troque a remada curvada por remada apoiada ou puxada.</div>`;
  c.innerHTML = html;
}

function setLoad(exId, v) { data.loads[dateEl.value+"|"+exId] = v; save(); }
function setRep(exId, v) { data.reps[dateEl.value+"|"+exId] = v; save(); }

render();
</script>
</body>
</html>
